<!DOCTYPE html>
<html>
  <head>
    <title>Products</title>
  </head>
  <body>
    <h1>Products</h1>
    <button id="get-products-btn">Get products</button>
    <div id="output"></div>

    <form id="product-form">

    </form>

    <script src="./js/main.js"></script>
  </body>
</html>
